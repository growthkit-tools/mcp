name: ci

# WICHTIG (AGENTS.md §2): Diese Action testet und probt AUSSCHLIESSLICH.
# Sie deployt nie. Deploy und Preview-Upload gehoeren Cloudflare Workers Builds.
# Niemals `wrangler deploy` oder `wrangler versions upload` hier aufrufen.

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  # ---------------------------------------------------------------------------
  # DER NAME STIMMT NICHT — UND MUSS TROTZDEM BLEIBEN.
  # Dieser Job fuehrt weder Unit-Tests noch einen Typecheck aus. Nachgesehen am
  # 28.08.2026, nicht vermutet: es gab NIE eine *.test.js/*.spec.ts (git log ueber
  # alle Commits; dasselbe Instrument mit *.sh liefert Treffer, ist also nicht
  # kaputt) und NIE ein tsconfig.json oder einen tsc-Aufruf (git log -S, leer).
  # Was er tatsaechlich prueft: bash -n ueber die CI-Bash-Dateien, source-invariants.sh
  # und guard-push.sh. Das ist nicht nichts — es ist nur etwas anderes als der Name.
  #
  # NICHT KORRIGIEREN. "Unit & Typecheck" ist zusammen mit "Probe (Preview)" ein
  # REQUIRED STATUS CHECK auf main, bei enforce_admins: true und strict: true. Wer
  # den Namen aendert, VERRIEGELT main: der required context berichtet nie wieder,
  # und der PR, der die Umbenennung zuruecknaehme, ist selbst blockiert. Siehe
  # AGENTS.md, "Notausgang: enforce_admins temporaer loesen" — dort steht genau
  # dieser Fall als Beispiel. Der Widerspruch ist bekannt und bewusst.
  unit:
    name: Unit & Typecheck
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gebraucht vom gitleaks-BEREICHS-Scan weiter unten, der
      # origin/main..HEAD liest. Mit der Standardtiefe 1 gaebe es keinen
      # merge-base und der Schritt waere nicht durchfuehrbar. Kostet bei 80
      # Commits nichts Messbares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Erster Step: kostet Millisekunden, faengt Syntaxfehler, die bash sonst
      # erst zur Laufzeit meldet — nachdem die halbe Datei schon gelaufen ist.
      # Alle Bash-Dateien, auf die CI sich stuetzt. Keine Anzahl hier — sie stand
      # frueher als "drei" und war laengst sechs (AGENTS.md §7a).
      - name: Bash-Syntax
        run: |
          bash -n scripts/probe.sh
          bash -n tests/source-invariants.sh
          bash -n tests/report-tools.sh
          bash -n tests/auth-paths.sh
          bash -n tests/authed-smoke.sh
          bash -n tests/guard-push.sh
          bash -n tests/deno-lint.sh

      # Quellreine Invarianten (AGENTS.md §11): reine Funktionen des Checkouts —
      # kein HTTP, keine laufende Instanz, kein Workers Build. Deshalb HIER und
      # nicht im probe-Job: der wird uebersprungen, sobald ein Commit nur
      # build-watch-excluded Pfade anfasst (*.md, tests/**, scripts/**, .github/**,
      # .claude/**, specs/**) — und genau dann waere eine kaputte quellreine
      # Assertion still gruen geblieben und erst beim naechsten index.js-Commit
      # aufgefallen. Steht vor npm, weil der Check kein node braucht.
      - run: bash tests/source-invariants.sh

      # Selbsttest des Push-Guards. Gehoert aus demselben Grund hierher wie die
      # Quell-Invarianten: kein HTTP, keine Instanz, kein Workers Build — und der
      # unit-Job wird nie uebersprungen. Der Guard bringt seine Repo-Zustaende
      # selbst mit, haengt also nicht daran, welchen Branch actions/checkout
      # gerade ausgecheckt hat (push-Event: Branch, pull_request: detached HEAD).
      - run: bash tests/guard-push.sh

      # ───────────────────────────────────────────────────────────────────────
      # LINT. Bis zum 30.08.2026 lief in diesem Repo KEIN Linter — weder in CI
      # noch lokal, und package.json hat bis heute kein lint-Script.
      #
      # Der Anlass kommt aus growthkit-website: dort war eslint konfiguriert und
      # wurde nirgends aufgerufen. 29 Meldungen, seit jeher unsichtbar. Ein
      # Linter, den niemand faehrt, ist keine Pruefung — und ein Repo ohne
      # Linter hat wenigstens keine falsche Zusage.
      #
      # ⚠️ deno IN EINEM NICHT-DENO-REPO. Die Werkzeugkette hier ist Node +
      # wrangler. deno lint ist trotzdem die guenstigste Wahl: keine Dependency
      # im package.json, parst .js und .ts gleichermassen. eslint zoege einen
      # Baum npm-Pakete in ein Repo, das bewusst drei devDependencies hat.
      #
      # Version gepinnt wie bei gitleaks: eine wandernde Linter-Version aendert
      # die Fundmenge, ohne dass jemand etwas committet haette. Steht hier UND
      # in AGENTS.md (Werkzeuge) — dort als Maschinen-, hier als CI-Eigenschaft.
      - name: deno installieren
        run: |
          set -euo pipefail
          V=2.8.0
          curl -sSfL -o /tmp/deno.zip \
            "https://github.com/denoland/deno/releases/download/v${V}/deno-x86_64-unknown-linux-gnu.zip"
          unzip -q -o /tmp/deno.zip -d /tmp
          sudo install -m 0755 /tmp/deno /usr/local/bin/deno
          deno --version | head -1

      # Fail-closed: die Suite endet mit 1, sobald der Ist-Zustand vom
      # Schuldschein abweicht — in BEIDE Richtungen. Sie braucht kein Netz und
      # keine Instanz und steht deshalb hier, im unit-Job, der nie uebersprungen
      # wird.
      - run: bash tests/deno-lint.sh

      # ═══════════════════════════════════════════════════════════════════════
      # SECRET-SCAN. Ergaenzt die Pfadform-Assertion in source-invariants.sh
      # (die liest NAMEN und sieht nicht in Dateien hinein), ersetzt sie nicht.
      #
      # ⚠️ WARUM HIER MEHR ALS NEBENAN. Dies ist das einzige OEFFENTLICHE Repo.
      # GitHub Push Protection ist aktiv, deckt aber weniger ab, als es
      # aussieht: sie greift erst beim Push, und ihr Regelsatz ist enger als der
      # von gitleaks. Am 28.08.2026 gemessen: der echte `gk_view_…`-Token dieses
      # Repos wird vom gitleaks-STANDARDsatz nicht gefunden — erst von der
      # eigenen Regel in .gitleaks.toml. Was der Standardsatz nicht kennt, kennt
      # GitHub auch nicht.
      #
      # Version gepinnt: eine wandernde Scanner-Version aendert die Fundmenge,
      # ohne dass jemand etwas committet haette.
      # ═══════════════════════════════════════════════════════════════════════
      - name: gitleaks installieren
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --no-git: geprueft wird der CHECKOUT. actions/checkout legt ausschliesslich
      # getrackte Dateien an — die gitignorierten gk-mcp-key.pem und .gk-ci-token
      # existieren hier gar nicht. Ihre Ausnahmen in .gitleaks.toml stehen nur fuer
      # den lokalen Lauf.
      #
      # ⚠️ DER BYTE-GUARD IST TRAGEND (§18a a). "no leaks found" ist auch dann
      # gruen, wenn der Scanner ueber NULL Dateien gelaufen ist — falscher
      # --source-Pfad, leerer Checkout, eine Konfiguration, die alles ausschliesst.
      #
      # ⚠️ SCHWELLE HIER ANDERS ALS IN growthkit-website (dort TEXT/2), und das
      # ist gemessen, nicht uebernommen. Erstmessung 28.08.2026:
      #
      #   getrackt gesamt          696 309 B
      #   davon binaer                   0 B  =  0,0 %   (nebenan: 54,8 %)
      #   gescannt                 479 635 B  =  0,689 x Text
      #
      # Die Bezugsgroesse "Text" ist hier gleich "Gesamt" — es gibt keine
      # Binaerassets. Trotzdem liegt das Verhaeltnis bei 0,689 statt bei ~1,15
      # wie nebenan, und der Grund ist DIREKT nachgemessen, nicht geschlossen:
      # gitleaks' eigene Default-Allowlist ueberspringt Lockfiles und SVG. Jede
      # dieser drei Dateien scannt einzeln als "~0 bytes":
      #
      #   package-lock.json                  88 917 B
      #   mcp-directory-shim/package-lock.json  109 691 B
      #   favicon.svg                        18 057 B
      #                                     ────────────
      #                                     216 665 B  = exakt die Luecke
      #
      # Bei TEXT/2 laege der Abstand zur Schwelle nur bei 38 %; EIN weiteres
      # Lockfile dieser Groesse brachte den Schritt an den Rand — rot, ohne dass
      # am Scan etwas waere. Deshalb TEXT/3: Abstand 107 %, und "gar nichts
      # gescannt" faengt es unveraendert. Der Guard soll einen ZUSAMMENBRUCH
      # fangen, nicht die Repo-Groesse nachverfolgen.
      - name: gitleaks — Checkout
        shell: bash
        run: |
          set -uo pipefail
          OUT=$(gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner 2>&1)
          RC=$?
          echo "$OUT"

          BYTES=$(printf '%s' "$OUT" | grep -oE 'scanned ~[0-9]+ bytes' | grep -oE '[0-9]+' | head -1)
          # -I laesst Binaerdateien weg — dieselbe Grenze, die gitleaks zieht.
          TEXT=$(git ls-files -z | xargs -0 grep -IlZ '' 2>/dev/null \
                 | xargs -0 stat -c%s 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "── gescannt: ${BYTES:-<nicht geparst>} Bytes · getrackter Text: ${TEXT} Bytes"

          if [ -z "${BYTES:-}" ]; then
            echo "::error::Byte-Zahl nicht aus der Scanner-Ausgabe geparst — Ausgabeformat geaendert? Ohne sie liefe der Guard leer-wahr durch (§18a a/c)."
            exit 1
          fi
          if [ "$TEXT" -eq 0 ]; then
            echo "::error::Keine getrackte Textdatei gefunden — der Vergleichswert waere 0 und der Guard bestuende immer (§18a a)."
            exit 1
          fi
          if [ "$BYTES" -lt $((TEXT / 3)) ]; then
            echo "::error::Nur ${BYTES} von ${TEXT} getrackten Text-Bytes gescannt — der Scan hat den Grossteil des Repos nicht gesehen."
            exit 1
          fi

          exit $RC

      # ⚠️ DER BEREICHS-SCAN — hier, weil das Repo OEFFENTLICH ist, und nur hier.
      #
      # Der Checkout-Scan oben sieht den ENDZUSTAND. Ein Wert, der in Commit A
      # hinzukommt und in Commit B desselben Branches wieder verschwindet, ist
      # fuer ihn unsichtbar — und war trotzdem ab dem Push weltweit lesbar.
      # Genau diese Luecke schliesst kein anderer Schritt: Push Protection
      # greift mit engerem Regelsatz, und der Pre-Commit-Hook nur dort, wo ihn
      # jemand installiert hat.
      #
      # ⚠️ WARUM NICHT DIE GANZE HISTORIE. In supabase und growthkit-website
      # steht kein Historien-Gate, weil es dort auf unveraenderlichen Altfunden
      # dauerhaft rot stuende. HIER waere es HEUTE gruen — der Erstscan am
      # 28.08.2026 fand ueber 79 von 80 Commits (der 80. ist leer) NULL Funde.
      # Der Grund dagegen ist trotzdem da, nur ein anderer: ein Gate ueber die
      # ganze Historie wuerde beim ERSTEN echten Fund dauerhaft rot — und die
      # richtige Reaktion auf einem oeffentlichen Repo ist ROTIEREN, nicht
      # Historie umschreiben. Rotieren macht es aber nicht wieder gruen. Ab dann
      # blockierte es jeden PR, auch den mit der Behebung, und erzwaenge
      # Allowlist-Eintraege, die WACHSEN statt zu schrumpfen.
      #
      # Der Bereich origin/main..HEAD hat dieses Problem nicht: er ist nach dem
      # Merge leer und kann nichts aus der Vergangenheit mitschleppen.
      - name: gitleaks — Commit-Bereich (oeffentliches Repo)
        shell: bash
        run: |
          set -uo pipefail
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "::error::Kein merge-base zu origin/main — fetch-depth: 0 fehlt? Ohne Bereich prueft dieser Schritt nichts (§18a c)."
            exit 1
          fi

          N=$(git rev-list --count "$BASE..HEAD")
          # Leerer Bereich = HEAD ist in origin/main enthalten. Das ist der
          # Normalfall auf main nach dem Merge und wird BENANNT, nicht
          # stillschweigend uebersprungen (§18a c).
          #
          # ⚠️ HIER STAND EIN ZWEITER ZWEIG ("leer, obwohl HEAD nicht in main")
          # UND IST BEIM FALSIFIZIEREN GEFLOGEN. Er liess sich nicht rot fahren,
          # weil es den Zustand nicht gibt: `rev-list --count main..HEAD` == 0
          # bedeutet, dass jeder von HEAD erreichbare Commit auch von main
          # erreichbar ist — und genau das IST "HEAD ist Vorfahr". Eine
          # Assertion, die nicht eintreten kann, ist keine, sie sieht nur so aus.
          # Der tragende Nicht-Leer-Guard steht stattdessen unten auf der Zahl
          # der tatsaechlich GESCANNTEN Commits.
          if [ "$N" -eq 0 ]; then
            echo "── HEAD ist in origin/main enthalten — kein eigener Commit-Bereich, nichts zu scannen."
            exit 0
          fi

          # Leere Commits liefern keinen Patch und werden von gitleaks nicht
          # gezaehlt — beim Erstscan war das genau einer von 80. Deshalb wird
          # gegen die Zahl der NICHT-leeren Commits verglichen, nicht gegen N.
          NONEMPTY=0
          for c in $(git rev-list "$BASE..HEAD"); do
            [ -n "$(git show --format= --name-only "$c")" ] && NONEMPTY=$((NONEMPTY+1))
          done
          echo "── Bereich ${BASE:0:8}..HEAD · ${N} Commit(s), davon ${NONEMPTY} mit Inhalt"

          OUT=$(gitleaks detect --source . --log-opts="$BASE..HEAD" --config .gitleaks.toml --redact --no-banner 2>&1)
          RC=$?
          echo "$OUT"

          SCANNED=$(printf '%s' "$OUT" | grep -oE '[0-9]+ commits scanned' | grep -oE '[0-9]+' | head -1)
          if [ "$NONEMPTY" -gt 0 ] && [ "${SCANNED:-0}" -lt 1 ]; then
            echo "::error::${NONEMPTY} Commit(s) mit Inhalt im Bereich, aber ${SCANNED:-0} gescannt — der Scan ist leer durchgelaufen (§18a a)."
            exit 1
          fi

          exit $RC

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # NICHT MIT ENTFERNEN, falls der vitest-Step darunter je wegfaellt. Dieser
      # Schritt haengt heute nur deshalb hier, weil vitest ihn braucht — sein Wert
      # ist davon unabhaengig: er ist die EINZIGE Stelle, die den Install-Pfad aus
      # AGENTS.md §5 prueft, BEVOR Workers Builds ihn faehrt. Dort laeuft
      # `npm clean-install` gegen dasselbe package-lock.json. Bricht das Lockfile
      # oder eine gepinnte Version, faellt es hier auf — sonst erst im
      # Production-Deploy, den diese Action nach §2 nicht anfassen darf.
      - run: npm ci

      # Cloudflares Build-Umgebung blockiert postinstall-Scripts (npm 10.9 allow-scripts).
      # esbuild TRAEGT: vitest bootet ueber vite, das die Binary braucht.
      # WORKERD TRAEGT HEUTE NICHT. Die frueher hier stehende Begruendung —
      # "workerd ist die Runtime, in der vitest-pool-workers die Tests ausfuehrt" —
      # setzt eine Verdrahtung voraus, die es in diesem Repo NIE gab: es existiert
      # keine vitest.config.* (und hat nie eine existiert), also kein
      # defineWorkersConfig, also benutzt vitest seinen Default-Pool.
      # @cloudflare/vitest-pool-workers steht in den devDependencies und wird nie
      # geladen. workerd steht hier auf Vorrat fuer den Tag, an dem der Pool
      # verdrahtet wird — nicht fuer heute.
      - run: npm rebuild workerd esbuild

      # HEUTIGER ZUSTAND, damit ihn niemand fuer Abdeckung haelt: es gibt keine
      # einzige Testdatei, und es gab nie eine. DIESER SCHRITT BESTEHT, WEIL ER
      # NICHTS PRUEFT — vitest findet nichts und endet mit --passWithNoTests auf 0.
      # Belegt bleibt allein, dass die gepinnte Werkzeugkette ueberhaupt startet.
      #
      # --passWithNoTests ist ein bewusster Platzhalter, kein Ueberbleibsel:
      # ENTFERNEN, sobald der erste echte Test existiert — sonst maskiert das Flag
      # spaeter eine kaputte Test-Discovery.
      #
      # `npm test` traegt das Flag NICHT und endet lokal mit 1. Die Divergenz ist
      # gewollt und dokumentiert: lokal soll "es gibt keine Tests" sichtbar sein,
      # hier soll es den Job nicht rot machen. Siehe AGENTS.md, Werkzeuge-Block
      # und "Bekannte Fallen".
      - run: npx --no-install vitest run --passWithNoTests

  # ---------------------------------------------------------------------------
  probe:
    name: Probe (Preview)
    runs-on: ubuntu-latest
    # Fuer den authed-smoke-Job: er braucht dieselbe Warte-Entscheidung und
    # dieselbe URL. Ueber Outputs statt ueber eine zweite Kopie der Logik.
    outputs:
      skip:   ${{ steps.wait.outputs.skip }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Auf Workers Build warten
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          # Workers Builds meldet als GitHub App ueber die CHECKS-API, nicht ueber
          # die Statuses-API. /commits/{sha}/status liefert dort immer n:0 — der
          # probe-Job wurde dadurch bei JEDEM Lauf uebersprungen (verifiziert 19.08.).
          #
          # Exakter Name-Match: aus diesem Repo bauen ZWEI Worker,
          # growthkit-mcp und growthkit-mcp-demo. Ein Teilstring-Match wuerde
          # auf den falschen warten.
          for i in $(seq 1 40); do
            RAW=$(gh api "repos/$REPO/commits/$SHA/check-runs" 2>/dev/null || echo '{}')
            CTX=$(echo "$RAW" | jq -c '[.check_runs[]? | select(.name == "Workers Builds: growthkit-mcp")] | .[0] // empty')

            if [ -z "$CTX" ]; then
              # ZWEI URSACHEN fuer eine leere Liste, und sie sehen identisch aus.
              # Die Schleife deckt beide ab — bisher stand nur die erste hier.
              #
              # (1) KEIN BUILD AUSGELOEST. Normalfall bei Commits, die nur
              # Build-watch-excluded Pfade anfassen: *.md, specs/**, .claude/**,
              # .github/**, tests/**, scripts/**. Autoritativ ist die Liste im
              # Cloudflare-Dashboard — das hier ist eine Kopie und kann driften.
              #
              # (2) NOCH KEIN BUILD REGISTRIERT (AGENTS.md §18a m). Eine Messung vor
              # dem Ereignis kann es nicht sehen, und die leere Antwort liest sich wie
              # "es gibt nichts" statt "es gibt noch nichts". Beleg am 24.08.2026:
              # `gh pr checks --watch` kehrte SOFORT mit "no checks reported" zurueck,
              # weil die Runs nach einem update-branch noch nicht angelegt waren.
              # Genau deshalb schliesst dieser Zweig nicht beim ERSTEN leeren Ergebnis
              # auf "kein Build", sondern erst nach acht Runden — die Wartezeit ist
              # nicht Grosszuegigkeit, sie ist die Trennung der beiden Faelle.
              # Wer den Schwellwert senkt, macht (2) wieder zu (1) und bekommt einen
              # uebersprungenen probe-Job, der nach "nichts zu tun" aussieht.
              #
              # ACHTUNG (Stand 20.08.): WANN die Excludes greifen, ist nur teilweise
              # belegt. Belegstand:
              #   * Merge-Commits auf main mit nur exkludierten Pfaden bauen NICHT.
              #   * Der erste Push eines NEUEN Branches baut IMMER (keine Diff-Basis).
              #   * Ein Folge-Push auf einem Branch MIT Build-Historie baut EBENFALLS
              #     (a198ebd: nur AGENTS.md, gebaut, obwohl *.md als Exclude gesetzt
              #     ist — im Dashboard am 20.08. nachgesehen).
              # Warum die Excludes auf Feature-Branches nicht greifen, ist OFFEN.
              #
              # Fuer diesen Zweig heisst das: er ist korrekt fuer den Fall, dass
              # Cloudflare nicht baut — aber WANN das eintritt, wissen wir nicht.
              # "Kein Build" ist auf einem Feature-Branch derzeit nicht vorhersagbar,
              # also nichts, was man erwarten oder woraus man etwas schliessen darf.
              if [ "$i" -ge 8 ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::Kein Workers Build fuer diesen Commit — Probe uebersprungen."
                echo "Vorhandene Check-Runs:"; echo "$RAW" | jq -r '.check_runs[]?.name'
                exit 0
              fi
            else
              # .status = queued|in_progress|completed · .conclusion = success|failure|…
              STATE=$(echo "$CTX" | jq -r 'if .status != "completed" then "pending" else .conclusion end')
              echo "[$i] Workers Builds: $STATE"
              if [ "$STATE" = "success" ]; then
                echo "skip=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "cancelled" ] || [ "$STATE" = "timed_out" ]; then
                echo "::error::Workers Build fehlgeschlagen ($STATE) — Probe sinnlos."
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::Timeout beim Warten auf den Workers Build (10 min)."
          exit 1

      # Eigener Step, damit MEHRERE Folge-Steps dieselbe URL benutzen koennen.
      # Vorher lag die Slug-Logik als Shell-Variable im Probe-Step und war
      # ausserhalb davon unsichtbar — der Report-Test haette sie duplizieren
      # muessen, und zwei Kopien derselben URL-Herleitung driften.
      - name: Target-URL bestimmen
        id: target
        if: steps.wait.outputs.skip == 'false'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          if [ "$BRANCH" = "main" ]; then
            # main deployt nach Production — es gibt keine Preview-Alias-URL.
            TARGET="https://mcp.growthkit.tools"
          else
            # Annahme: Cloudflare ersetzt '/' durch '-'. Verifiziert an
            # chore/harness-bootstrap -> chore-harness-bootstrap.
            SLUG="${BRANCH//\//-}"
            TARGET="https://${SLUG}-growthkit-mcp.purple-sun-a0b3.workers.dev"
          fi
          echo "Target: $TARGET"
          # $GITHUB_ENV fuer die Folge-Steps in DIESEM Job, $GITHUB_OUTPUT fuer
          # den authed-smoke-Job — Jobs teilen kein $GITHUB_ENV.
          echo "TARGET=$TARGET"  >> "$GITHUB_ENV"
          echo "target=$TARGET"  >> "$GITHUB_OUTPUT"

      - name: Probe ausfuehren
        if: steps.wait.outputs.skip == 'false'
        run: |
          set -uo pipefail
          echo "Probe gegen: $TARGET"
          chmod +x scripts/probe.sh
          ./scripts/probe.sh "$TARGET"

      # always(): der Report-Test muss auch dann laufen, wenn probe.sh rot ist.
      # Sonst zeigt ein Lauf nur die halbe Diagnose — dasselbe Prinzip, aus dem
      # probe.sh kein `set -e` benutzt.
      #
      # Zum Guard (gilt fuer alle drei Steps oben, deshalb einheitlich
      # `== 'false'`): der wait-Step setzt skip NUR auf seinen Erfolgspfaden —
      # false = Build da, true = kein Build fuer diesen Commit. Bei
      # fehlgeschlagenem Build oder Timeout beendet er sich mit exit 1 und setzt
      # den Output gar nicht. `!= 'true'` ist auf einem leeren Output wahr; in
      # Kombination mit always() wuerde der Step dann feuern und eine veraltete
      # oder nicht existierende Preview-URL proben. Ohne always() ist die
      # Schreibweise folgenlos — aber zwei Schreibweisen fuer dieselbe Bedingung
      # sind eine Drift-Quelle, also ueberall dieselbe.
      - name: Report-Tools testen
        if: always() && steps.wait.outputs.skip == 'false'
        run: |
          set -uo pipefail
          echo "Report-Tools gegen: $TARGET"
          chmod +x tests/report-tools.sh
          ./tests/report-tools.sh "$TARGET"

      # Auth-Grenze. always() aus demselben Grund wie beim Report-Test: faellt
      # probe.sh rot aus, ist die Auth-Diagnose gerade dann interessant.
      # Secret-frei — nur Negativfaelle und oeffentliche Methoden.
      - name: Auth-Pfade testen
        if: always() && steps.wait.outputs.skip == 'false'
        run: |
          set -uo pipefail
          echo "Auth-Pfade gegen: $TARGET"
          chmod +x tests/auth-paths.sh
          ./tests/auth-paths.sh "$TARGET"

  # ---------------------------------------------------------------------------
  # Der einzige Job, der ein Secret braucht. Deshalb ein EIGENER Job und kein
  # Step im probe-Job: bei `pull_request` aus einem Fork reicht GitHub keine
  # Secrets durch. Als Step im probe-Job wuerde jeder Fork-PR den probe-Job rot
  # faerben; als eigener Job ist das Nicht-Laufen ein eigener, sichtbarer Zustand.
  #
  # `needs: probe` + `if: always()` — die Kombination ist tragend und die beiden
  # Haelften bedeuten VERSCHIEDENES:
  #   * needs:   koppelt die REIHENFOLGE. Ohne das startet dieser Job sofort und
  #              probt, bevor der Workers Build fertig ist. Genau so ist der erste
  #              Lauf gescheitert: Job-Start 15:17:53, Abbruch 15:18:00, Build erst
  #              15:19:24 fertig — 84 s zu frueh. Das war kein Flake, sondern das
  #              deterministische Ergebnis jedes Laufs.
  #   * always() entkoppelt das ERGEBNIS. Der Job laeuft auch, wenn probe rot ist —
  #              gerade dann ist die authentifizierte Diagnose interessant.
  # Wer needs: entfernt, um die Jobs zu "entkoppeln", entkoppelt die falsche
  # Haelfte und baut den Fehler von oben wieder ein.
  #
  # Warte-Entscheidung und Ziel-URL kommen als Job-Outputs aus probe. Keine zweite
  # Kopie der Build-Erkennung und keine zweite Kopie der Slug-Herleitung.
  authed-smoke:
    name: Authed Smoke
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    steps:
      - uses: actions/checkout@v7

      # Das Fork-Gate steht auf STEP-Ebene, NICHT am Job. Stuende es am Job, wuerde
      # der ganze Job uebersprungen — einschliesslich der warnenden Steps darunter,
      # und die fehlende Abdeckung waere wieder still.
      #
      # KEINE Bedingung auf "Secret vorhanden": ein fehlendes Secret expandiert zum
      # leeren String und laeuft im Skript in den Setup-Guard (exit 2). Ein
      # falsches Token laeuft in die Kollisions-Assertion (exit 1). Beide rot, aber
      # unterscheidbar — siehe Kopf von tests/authed-smoke.sh.
      #
      # skip == 'false' aus demselben Grund wie im probe-Job: der wait-Step setzt
      # den Output NUR auf seinen Erfolgspfaden. Bei fehlgeschlagenem Build oder
      # Timeout ist er leer, und `!= 'true'` wuerde zusammen mit always() gegen eine
      # veraltete Preview proben.
      - name: Authed Smoke
        if: needs.probe.outputs.skip == 'false' && github.event.pull_request.head.repo.fork != true
        env:
          GK_TOKEN: ${{ secrets.GK_CI_TOKEN }}
          TARGET:   ${{ needs.probe.outputs.target }}
        run: |
          set -uo pipefail
          echo "Authed Smoke gegen: $TARGET"
          chmod +x tests/authed-smoke.sh
          ./tests/authed-smoke.sh "$TARGET"

      # ZWEI getrennte Hinweise, nicht einer: "kein Secret wegen Fork" und "keine
      # Flaeche zum Proben" sind verschiedene Ursachen mit verschiedenen Fixes. Ein
      # gemeinsamer Text waere wieder eine Signatur fuer zwei Faelle — derselbe
      # Fehler wie beim doppeldeutigen exit 2.
      - name: Hinweis — Fork-PR, kein Secret
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "::warning::Fork-PR — GitHub reicht keine Secrets durch. Der authentifizierte Smoke-Test ist NICHT gelaufen: Rollenfilterung, gk_-Auth-Pfad und der Beispielwert-Test aus #4 sind in diesem Lauf ungeprueft."

      - name: Hinweis — keine Preview-Flaeche
        if: needs.probe.outputs.skip != 'false' && github.event.pull_request.head.repo.fork != true
        run: |
          echo "::warning::Kein Workers Build fuer diesen Commit (oder Build fehlgeschlagen) — es gibt keine Preview-Flaeche. Der authentifizierte Smoke-Test ist NICHT gelaufen; Rollenfilterung, gk_-Auth-Pfad und der Beispielwert-Test aus #4 sind ungeprueft."
